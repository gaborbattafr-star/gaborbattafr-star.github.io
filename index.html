<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Justice for Gabor Batta | Igazságot Batta Gábornak</title>
  <meta name="google-site-verification" content="google429b353a0b763a4d" />
  <meta name="description" content="Batta Gabor eroszakos tamadas aldozata Strasbourgban. 6 evig nem nyomoztak. Most bortonnel fenyegetik. EJEB Rule 39 eljaras folyamatban." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#1a1208; --paper:#f5f0e8; --red:#c0392b; --mid:#6b5e4a; --light:#e8e0d0; --accent:#8b6914; }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--paper);color:var(--ink);font-family:'Source Serif 4',Georgia,serif;font-weight:300;line-height:1.75;}
    .lang-bar{background:var(--ink);display:flex;justify-content:flex-end;padding:0.4rem 1.5rem;gap:0.5rem;}
    .lang-btn{font-family:'Space Mono',monospace;font-size:0.65rem;letter-spacing:0.12em;text-transform:uppercase;padding:0.3rem 0.9rem;border:1px solid rgba(255,255,255,0.3);background:transparent;color:rgba(255,255,255,0.6);cursor:pointer;transition:all 0.2s;}
    .lang-btn.active{background:var(--red);color:#fff;border-color:var(--red);}
    .lang-btn:hover{color:#fff;border-color:#fff;}
    .urgent{background:var(--red);color:#fff;text-align:center;padding:0.8rem 1rem;font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.1em;animation:pulse 2s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.82}}
    .masthead{border-top:5px solid var(--ink);border-bottom:1px solid var(--ink);text-align:center;padding:2.5rem 1rem 2rem;}
    .masthead-label{font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--mid);margin-bottom:0.8rem;}
    .masthead h1{font-family:'Playfair Display',serif;font-size:clamp(2.2rem,9vw,5rem);font-weight:900;line-height:1.0;}
    .masthead h1 .highlight{color:var(--red);}
    .masthead-sub{font-family:'Playfair Display',serif;font-size:clamp(0.95rem,2.5vw,1.35rem);font-style:italic;color:var(--mid);margin-top:0.6rem;}
    .masthead-date{font-family:'Space Mono',monospace;font-size:0.58rem;color:var(--mid);margin-top:0.8rem;border-top:1px solid var(--light);padding-top:0.6rem;}
    .container{max-width:980px;margin:0 auto;padding:0 1.5rem;}
    .hero{display:grid;grid-template-columns:3fr 2fr;gap:3rem;padding:2.5rem 0 2rem;border-bottom:2px solid var(--ink);}
    @media(max-width:640px){.hero{grid-template-columns:1fr;gap:1.5rem;}}
    .kicker{font-family:'Space Mono',monospace;font-size:0.6rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--red);margin-bottom:0.5rem;}
    .hero-text h2{font-family:'Playfair Display',serif;font-size:clamp(1.35rem,3.5vw,2rem);font-weight:700;line-height:1.18;margin-bottom:1.1rem;}
    .hero-text p{font-size:1rem;color:#2a2218;}
    p+p{margin-top:0.9rem;}
    .hero-image img{width:100%;border:1px solid var(--mid);display:block;}
    .img-caption{font-family:'Space Mono',monospace;font-size:0.6rem;color:var(--mid);margin-top:0.4rem;font-style:italic;}
    section{padding:2.5rem 0;border-bottom:1px solid var(--light);}
    .section-header{display:flex;align-items:baseline;gap:1rem;margin-bottom:1.5rem;}
    .section-num{font-family:'Playfair Display',serif;font-size:3.2rem;font-weight:900;color:var(--light);line-height:1;flex-shrink:0;}
    .section-title{font-family:'Playfair Display',serif;font-size:clamp(1.15rem,3vw,1.65rem);font-weight:700;border-left:3px solid var(--red);padding-left:0.75rem;line-height:1.2;}
    .pull-quote{border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:1.5rem 1rem;margin:2rem 0;font-family:'Playfair Display',serif;font-size:clamp(1rem,2.8vw,1.45rem);font-style:italic;color:var(--red);text-align:center;line-height:1.4;}
    .statement {background:#fff9f2; border-left:5px solid var(--red); padding:2rem; margin:2rem 0; font-size:0.95rem; line-height:1.75;}
    .statement h3 {font-family:'Playfair Display',serif; color:var(--red); margin-bottom:1.2rem;}
    .statement ul {margin:1rem 0; padding-left:1.5rem;}
    .images-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-top:1rem;}
    .images-grid img{width:100%;border:1px solid var(--mid);display:block;}
    .images-grid figcaption{font-family:'Space Mono',monospace;font-size:0.7rem;color:var(--mid);text-align:center;margin-top:0.4rem;}
    .help-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0.9rem;margin-top:1.5rem;}
    .help-card{background:var(--ink);color:var(--paper);padding:1.4rem;text-decoration:none;display:block;transition:background 0.2s;}
    .help-card:hover{background:var(--red);}
    .hc-label{font-family:'Space Mono',monospace;font-size:0.55rem;letter-spacing:0.18em;text-transform:uppercase;margin-bottom:0.5rem;opacity:0.65;}
    .hc-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;line-height:1.3;}
    .hc-sub{font-size:0.75rem;margin-top:0.4rem;opacity:0.8;}
    footer{background:var(--ink);color:rgba(255,255,255,0.5);text-align:center;padding:2.5rem 1rem;font-family:'Space Mono',monospace;font-size:0.65rem;letter-spacing:0.1em;line-height:2.2;}
    footer a{color:rgba(255,255,255,0.8);text-decoration:none;}
    .body-en .hu{display:none!important;}
    .body-hu .en{display:none!important;}
  </style>
</head>
<body class="body-hu" id="body">

<div class="lang-bar">
  <button class="lang-btn" onclick="setLang('en')">EN</button>
  <button class="lang-btn active" onclick="setLang('hu')">HU</button>
</div>

  <span class="en">URGENT: Imprisonment reporting deadline — April 29, 2026 — ECHR Rule 39 proceedings active</span>
</div>
